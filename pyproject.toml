[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-chunk-boundary-aligner"
version = "0.1.0"
description = "Splits markdown and technical docs along heading and paragraph boundaries with breadcrumb inheritance"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-chunk-boundary-aligner = "semantic_chunk_boundary_aligner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_chunk_boundary_aligner*"]
